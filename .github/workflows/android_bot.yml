name: Android Bot
on:
  workflow_dispatch: # يسمح لك بتشغيله يدوياً من GitHub

jobs:
  run-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Android Emulator (Android 10 with Play Store)
        run: |
          # تشغيل حاوية الأندرويد
          docker run -d --name android \
            --privileged \
            -p 5555:5555 \
            -e "APPIUM=true" \
            -e "WEBVIEW=true" \
            budtmo/docker-android:emulator_10.0_google_apis_playstore
            
          echo "Waiting for Android to boot (3 minutes)..."
          sleep 180 # الانتظار 3 دقائق حتى يقلع الأندرويد بالكامل

      - name: Run Bot Script
        run: python bot.py
